[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simbench"
version = "0.0.1"
description = "Simulated-user evaluation framework for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
